name: Bot de ofertas Shopee

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min (horário UTC; pode atrasar alguns minutos)
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write             # necessário para salvar o postados.json

concurrency:
  group: bot-ofertas
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o bot
        run: python bot_ofertas_shopee.py
        env:
          RODAR_UMA_VEZ: "1"
          INTERVALO_ENTRE_POSTS: "15"
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_WHATSAPP: ${{ secrets.TELEGRAM_CHAT_ID_WHATSAPP }}

      - name: Salvar histórico de postados
        run: |
          if [ -f postados.json ]; then
            git config user.name "bot-ofertas"
            git config user.email "bot-ofertas@users.noreply.github.com"
            git add postados.json
            git diff --cached --quiet || (git commit -m "Atualiza histórico de postados" && git push)
          fi
