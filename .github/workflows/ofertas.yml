name: Bot de ofertas Shopee

on:
  schedule:
    - cron: "7,27,47 11,15,23 * * *"   # tenta 3x em cada janela: ~08h, 12h e 20h de Brasília (UTC-3)
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write             # necessário para salvar o postados.json

concurrency:
  group: bot-ofertas
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o bot
        run: python bot_ofertas_shopee.py
        env:
          RODAR_UMA_VEZ: "1"
          INTERVALO_ENTRE_POSTS: "15"
          MIN_MINUTOS_ENTRE_ENVIOS: ${{ github.event_name == 'schedule' && '90' || '0' }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_WHATSAPP: ${{ secrets.TELEGRAM_CHAT_ID_WHATSAPP }}

      - name: Salvar histórico de postados
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          for f in postados.json ultimo_envio.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || (git commit -m "Atualiza histórico de postados" && git push)
